version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Storybook packages have to move in lockstep: the SB10 export paths
      # (storybook/theming/create, storybook/manager-api) differ by minor.
      storybook:
        patterns:
          - storybook
          - "@storybook/*"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Vite 8 pulls an esbuild that conflicts with tsup. ^7 is deliberate.
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      # Follows the vite pin: plugin-react 6 needs a newer Vite than ^7, so
      # npm ci fails with ERESOLVE. Unignore when the vite pin lifts.
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
      # TypeScript 7 is the native compiler rewrite; tsup's .d.ts generation
      # still uses the old compiler API and dies with
      # "Cannot read properties of undefined (reading 'useCaseSensitiveFileNames')".
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
