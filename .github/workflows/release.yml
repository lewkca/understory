name: Release

# Uses Changesets to publish to npm:
#   • if there are unconsumed changesets, it opens/updates a "Version Packages"
#     PR that bumps the version and updates the CHANGELOG;
#   • otherwise it publishes the current version to npm.
#
# MANUAL TRIGGER ONLY. This used to run on every push to main, but with no
# NPM_TOKEN secret set an automatic run failed on every push and left a
# permanent red X on the repo.
#
# To use this workflow you need ONE of:
#   • an NPM_TOKEN secret — an npm granular access token with read/write on the
#     @lewkca scope. Note these expire (~90 days max), after which this breaks
#     again silently; or
#   • trusted publishing via OIDC — configure @lewkca/understory's trusted
#     publisher on npmjs.com to point at this repo + workflow, then drop the
#     NODE_AUTH_TOKEN env below entirely. No stored credential, no expiry.
#     `id-token: write` is already granted below. Worth switching to once
#     @lewkca/understory exists, since npm only lets you configure a trusted
#     publisher for a package that has already been published once.
#
# To publish by hand instead:  npm login && npm publish --access public

on:
  workflow_dispatch:
    inputs:
      deprecate_old:
        description: "Also deprecate @lewkca/design-system (one-time, after the first Understory publish)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # A BRAND-NEW package takes several minutes to become installable, and the
      # registry looks broken in the meantime. On 0.2.0's first publish the
      # version and tarball endpoints returned 200 while the packument 404'd and
      # `npm install` failed — which reads exactly like a package published
      # restricted instead of public. It was not; it was propagation. Wait and
      # retry before changing anything.
      #
      # Do NOT use npmjs.com to check health: the website 403s non-browser
      # clients, so curl gets 403 for react too. Check the registry API instead,
      # or just try installing it.
      #
      # Note this action looks for an env var literally named NPM_TOKEN and logs
      # "No NPM_TOKEN found ... using npm trusted publishing" when it only finds
      # NODE_AUTH_TOKEN. The publish still authenticates, because setup-node
      # writes the token into .npmrc, which npm itself reads.
      - name: Create Release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # One-time, opt-in. Points anyone still installing the old name at the new
      # one. Deprecating does NOT unpublish: existing installs keep working, and
      # npm just prints this message on install.
      - name: Deprecate the previous package name
        if: ${{ inputs.deprecate_old }}
        run: >
          npm deprecate @lewkca/design-system
          "Renamed to @lewkca/understory. Same API, tokens and exports — update your import specifier."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
