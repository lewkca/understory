name: Release

# Uses Changesets to automate publishing to npm. On a push to main:
#   • if there are unconsumed changesets, it opens/updates a "Version Packages"
#     PR that bumps the version and updates the CHANGELOG;
#   • when that PR is merged, it publishes the new version to npm.
#
# Requires an NPM_TOKEN secret (an npm automation token with publish rights to
# the @lewkca scope) in the repo's Actions secrets.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Create Release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
