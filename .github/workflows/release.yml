name: Release

# Uses Changesets to publish to npm:
#   • if there are unconsumed changesets, it opens/updates a "Version Packages"
#     PR that bumps the version and updates the CHANGELOG;
#   • otherwise it publishes the current version to npm.
#
# MANUAL TRIGGER ONLY. This used to run on every push to main, but publishing
# is currently done by hand (`npm publish` locally, which prompts for the 2FA
# one-time password). With no NPM_TOKEN secret set, an automatic run failed on
# every single push and left a permanent red X on the repo.
#
# To use this workflow you need ONE of:
#   • an NPM_TOKEN secret — an npm granular access token with read/write on the
#     @lewkca scope. Note these expire (~90 days max), after which this breaks
#     again silently; or
#   • trusted publishing via OIDC — configure @lewkca/understory's trusted
#     publisher on npmjs.com to point at this repo + workflow, then drop the
#     NODE_AUTH_TOKEN env below entirely. No stored credential, no expiry.
#     `id-token: write` is already granted below.
#
# Until then, publish locally:  npm login && npm publish --access public

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Create Release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
